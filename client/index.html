<!DOCTYPE html>
<html lang="">
  <head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>INFT3075</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">function toggleSettings() {
            const drawer = document.getElementById('settings-drawer');
            const icon = document.getElementById('handle-icon');
            const isOpen = drawer.classList.toggle('is-open');
            
            if (isOpen) {
                icon.style.transform = 'rotate(180deg)';
            } else {
                icon.style.transform = 'rotate(0deg)';
            }
        }</script>
<style>
        body {
            background-color: #0c0e17;
            color: #f0f0fd;
            font-family: 'Manrope', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .crystal-ball-container {
            perspective: 1000px;
        }

        .crystal-ball {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0) 70%),
                        radial-gradient(circle at 50% 50%, rgba(126, 81, 255, 0.1), rgba(0, 227, 253, 0.05));
            box-shadow: 
                inset 0 0 50px rgba(126, 81, 255, 0.2),
                inset 0 0 20px rgba(0, 227, 253, 0.2),
                0 0 60px rgba(126, 81, 255, 0.1),
                0 0 100px rgba(0, 227, 253, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .crystal-ball::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            width: 40px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            filter: blur(8px);
            border-radius: 50%;
            transform: rotate(-35deg);
        }

        .inner-glow {
            position: absolute;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(0, 227, 253, 0.15) 0%, transparent 70%);
            filter: blur(20px);
        }

        .settings-drawer {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(calc(-100% + 48px));
        }

        .settings-drawer.is-open {
            transform: translateY(0);
        }

        .settings-handle {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
